name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    env:
      DEADCODE_VERSION: v0.48.0
      STATICCHECK_VERSION: v0.7.0
      ERRCHECK_VERSION: v1.20.0
      GOVULNCHECK_VERSION: v1.7.0
      ACTIONLINT_VERSION: v1.7.12
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install pinned Go analysis tools
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/lint-bin"
          GOBIN="$RUNNER_TEMP/lint-bin" go install "golang.org/x/tools/cmd/deadcode@${DEADCODE_VERSION}"
          GOBIN="$RUNNER_TEMP/lint-bin" go install "honnef.co/go/tools/cmd/staticcheck@${STATICCHECK_VERSION}"
          GOBIN="$RUNNER_TEMP/lint-bin" go install "github.com/kisielk/errcheck@${ERRCHECK_VERSION}"
          GOBIN="$RUNNER_TEMP/lint-bin" go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          GOBIN="$RUNNER_TEMP/lint-bin" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/lint-bin" >> "$GITHUB_PATH"
      - name: Install pinned ShellCheck
        run: |
          set -eu
          archive="$RUNNER_TEMP/shellcheck.tar.xz"
          curl -fsSLo "$archive" "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xf "$archive"
          cp "$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}/shellcheck" "$RUNNER_TEMP/lint-bin/shellcheck"
      - name: High-signal lint and dead-code gate
        run: make lint

  secrets:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Unit and race tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Publish package coverage summary
        run: |
          {
            echo '### Linux package coverage'
            echo
            echo '```text'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out > coverage.txt
      - name: Upload coverage data
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-package-coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: error
      - name: Root POSIX ACL integration
        run: sudo env PATH="$PATH" go test ./internal/homeaccess -run '^TestPlatform'
      - name: Vet
        run: go vet ./...
      - name: Linux socket integration
        run: ./tests/integration_linux.sh
      - name: Cross-compile releases
        run: make snapshot VERSION=ci

  compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.25.x"
          cache: false
      - name: Verify minimum supported Go version
        run: go test ./...

  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Build, install, and remove Debian package
        run: sudo env "PATH=$PATH" ./tests/deb_package_linux.sh

  apt-repository:
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install repository setup prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg
      - name: Configure the binary-only signed repository
        run: |
          set -eu
          ./setup-apt-repository.sh --component alpha
          source_file=/etc/apt/sources.list.d/lc-software-agent-root-broker.list
          test "$(grep -c '^deb ' "$source_file")" -eq 1
          if grep -Eq '^[[:space:]]*deb-src([[:space:]]|$)' "$source_file"; then
            echo "binary-only repository setup unexpectedly enabled deb-src" >&2
            exit 1
          fi
          test "$(apt-cache policy agent-root-broker | awk '/Candidate:/ {print $2}')" != "(none)"

  install-system:
    needs: [apt-repository, compatibility, packages, quality, secrets, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Stateless private pre-alpha migration test
        run: |
          sudo env \
            "PATH=$PATH" \
            ROOTBROKER_SYSTEM_TEST_ALLOW_MUTATION=1 \
            ROOTBROKER_TEST_APPROVER_USER=rootbroker-test-approver \
            ./tests/migrate_private_prealpha_linux.sh
      - name: Full install, reinstall, upgrade, and isolation test
        run: |
          sudo env \
            "PATH=$PATH" \
            ROOTBROKER_SYSTEM_TEST_ALLOW_MUTATION=1 \
            ROOTBROKER_TEST_CREATE_APPROVER=1 \
            ROOTBROKER_TEST_APPROVER_USER=rootbroker-test-approver \
            ./tests/install_system_linux.sh
