name: Repair v0.1.0-alpha.1 manifest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: v0.1.0-alpha.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Rebuild manifest from the five published assets
        run: |
          set -eu
          mkdir release-manifest
          gh release download "$TAG" --dir release-manifest
          set -- release-manifest/*.tar.gz
          [ "$#" -eq 2 ] || { echo "release must contain two tar archives" >&2; exit 2; }
          set -- release-manifest/*.deb
          [ "$#" -eq 2 ] || { echo "release must contain two Debian packages" >&2; exit 2; }
          [ -f release-manifest/rootbroker.rb ] || { echo "release formula is missing" >&2; exit 2; }
          (
            cd release-manifest
            sha256sum ./*.tar.gz ./*.deb ./rootbroker.rb > checksums.txt
            sha256sum -c checksums.txt
          )
      - name: Attest repaired manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-manifest/checksums.txt
      - name: Replace only the v0.1.0-alpha.1 manifest
        run: gh release upload "$TAG" release-manifest/checksums.txt --clobber
