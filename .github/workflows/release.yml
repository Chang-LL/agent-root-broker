name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in dry-run artifacts
        required: true
        default: v0.1.0-alpha.1-dry-run

permissions:
  contents: write
  id-token: write
  attestations: write
  pull-requests: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      CYCLONEDX_GOMOD_VERSION: v1.11.0
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install pinned SBOM generator
        run: |
          mkdir -p "$RUNNER_TEMP/release-bin"
          GOBIN="$RUNNER_TEMP/release-bin" go install \
            "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          echo "$RUNNER_TEMP/release-bin" >> "$GITHUB_PATH"
      - name: Build archives
        run: |
          set -eu
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+[-+][0-9A-Za-z.-]+$|^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "invalid release version: $VERSION" >&2
            exit 2
          }
          release_root="$RUNNER_TEMP/rootbroker-release"
          source_date_epoch=$(git log -1 --format=%ct)
          mkdir -p "$release_root"
          for arch in amd64 arm64; do
            stage="$release_root/rootbroker_${VERSION}_linux_${arch}"
            mkdir -p "$stage/packaging/config" "$stage/packaging/systemd"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$stage/rootbroker" ./cmd/rootbroker
            cyclonedx-gomod bin -json -output "$stage/rootbroker.bom.cdx.json" -version "$VERSION" "$stage/rootbroker"
            cp install.sh uninstall.sh LICENSE README.md README.zh-CN.md ROADMAP.md ROADMAP.zh-CN.md \
              SECURITY.md CONTRIBUTING.md SUPPORT.md COMPATIBILITY.md UPGRADE.md UNINSTALL.md \
              MIGRATION.md TROUBLESHOOTING.md THREAT_MODEL.md CHANGELOG.md "$stage/"
            cp -R profiles "$stage/"
            cp packaging/config/config.json.in "$stage/packaging/config/"
            cp packaging/systemd/rootbrokerd.service "$stage/packaging/systemd/"
            tar -C "$release_root" -czf "$release_root/rootbroker_${VERSION}_linux_${arch}.tar.gz" "rootbroker_${VERSION}_linux_${arch}"
            SOURCE_DATE_EPOCH="$source_date_epoch" scripts/build-deb.sh "$VERSION" "$arch" "$stage/rootbroker" "$release_root"
            rm -rf -- "$stage"
          done
          amd64_archive="rootbroker_${VERSION}_linux_amd64.tar.gz"
          arm64_archive="rootbroker_${VERSION}_linux_arm64.tar.gz"
          amd64_sha=$(sha256sum "$release_root/$amd64_archive" | cut -d' ' -f1)
          arm64_sha=$(sha256sum "$release_root/$arm64_archive" | cut -d' ' -f1)
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          scripts/render-homebrew-formula.sh "$VERSION" \
            "$release_url/$amd64_archive" "$amd64_sha" \
            "$release_url/$arm64_archive" "$arm64_sha" \
            "$release_root/rootbroker.rb"
          cd "$release_root"
          sha256sum ./*.tar.gz ./*.deb ./rootbroker.rb > checksums.txt
          cd "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain)" || {
            echo "release generation modified the source tree" >&2
            git status --short >&2
            exit 1
          }
          mkdir -p release
          cp "$release_root"/*.tar.gz "$release_root"/*.deb \
            "$release_root/rootbroker.rb" "$release_root/checksums.txt" release/
      - name: Attest release archives and checksums
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/rootbroker.rb
            release/checksums.txt
      - name: Upload dry-run release
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootbroker-release-${{ env.VERSION }}
          path: release/
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*)
              gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.deb release/rootbroker.rb release/checksums.txt \
                --generate-notes --verify-tag --prerelease
              ;;
            *)
              gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.deb release/rootbroker.rb release/checksums.txt \
                --generate-notes --verify-tag
              ;;
          esac
