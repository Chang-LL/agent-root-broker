name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version embedded in dry-run artifacts
        required: true
        default: v0.1.0-alpha.1-dry-run

permissions:
  contents: write
  id-token: write
  attestations: write
  pull-requests: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    env:
      CYCLONEDX_GOMOD_VERSION: v1.11.0
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.x"
          cache: false
      - name: Install pinned SBOM generator
        run: |
          mkdir -p "$RUNNER_TEMP/release-bin"
          GOBIN="$RUNNER_TEMP/release-bin" go install \
            "github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}"
          echo "$RUNNER_TEMP/release-bin" >> "$GITHUB_PATH"
      - name: Build archives
        run: |
          set -eu
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+[-+][0-9A-Za-z.-]+$|^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "invalid release version: $VERSION" >&2
            exit 2
          }
          release_root="$RUNNER_TEMP/rootbroker-release"
          source_date_epoch=$(git log -1 --format=%ct)
          mkdir -p "$release_root"
          for arch in amd64 arm64; do
            stage="$release_root/rootbroker_${VERSION}_linux_${arch}"
            mkdir -p "$stage/packaging/config" "$stage/packaging/systemd"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "$stage/rootbroker" ./cmd/rootbroker
            cyclonedx-gomod bin -json -output "$stage/rootbroker.bom.cdx.json" -version "$VERSION" "$stage/rootbroker"
            cp install.sh uninstall.sh migrate-private-prealpha.sh LICENSE README.md README.zh-CN.md ROADMAP.md ROADMAP.zh-CN.md \
              SECURITY.md CONTRIBUTING.md SUPPORT.md COMPATIBILITY.md UPGRADE.md UNINSTALL.md \
              MIGRATION.md TROUBLESHOOTING.md THREAT_MODEL.md CHANGELOG.md "$stage/"
            cp -R profiles "$stage/"
            cp packaging/config/config.json.in "$stage/packaging/config/"
            cp packaging/systemd/rootbrokerd.service "$stage/packaging/systemd/"
            tar -C "$release_root" -czf "$release_root/rootbroker_${VERSION}_linux_${arch}.tar.gz" "rootbroker_${VERSION}_linux_${arch}"
            SOURCE_DATE_EPOCH="$source_date_epoch" scripts/build-deb.sh "$VERSION" "$arch" "$stage/rootbroker" "$release_root"
            rm -rf -- "$stage"
          done
          amd64_archive="rootbroker_${VERSION}_linux_amd64.tar.gz"
          arm64_archive="rootbroker_${VERSION}_linux_arm64.tar.gz"
          amd64_sha=$(sha256sum "$release_root/$amd64_archive" | cut -d' ' -f1)
          arm64_sha=$(sha256sum "$release_root/$arm64_archive" | cut -d' ' -f1)
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          scripts/render-homebrew-formula.sh "$VERSION" \
            "$release_url/$amd64_archive" "$amd64_sha" \
            "$release_url/$arm64_archive" "$arm64_sha" \
            "$release_root/agent-root-broker.rb"
          cd "$release_root"
          sha256sum ./*.tar.gz ./*.deb ./agent-root-broker.rb > checksums.txt
          cd "$GITHUB_WORKSPACE"
          test -z "$(git status --porcelain)" || {
            echo "release generation modified the source tree" >&2
            git status --short >&2
            exit 1
          }
          mkdir -p release
          cp "$release_root"/*.tar.gz "$release_root"/*.deb \
            "$release_root/agent-root-broker.rb" "$release_root/checksums.txt" release/
      - name: Attest release archives and checksums
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.deb
            release/agent-root-broker.rb
            release/checksums.txt
      - name: Upload release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootbroker-release-${{ env.VERSION }}
          path: release/
          if-no-files-found: error
      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*)
              gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.deb release/agent-root-broker.rb release/checksums.txt \
                --generate-notes --verify-tag --prerelease
              ;;
            *)
              gh release create "$GITHUB_REF_NAME" release/*.tar.gz release/*.deb release/agent-root-broker.rb release/checksums.txt \
                --generate-notes --verify-tag
              ;;
          esac

  publish-cloudsmith:
    if: github.ref_type == 'tag'
    needs: release
    runs-on: ubuntu-24.04
    environment: cloudsmith-publish
    permissions:
      contents: read
      id-token: write
    env:
      CLOUDSMITH_NAMESPACE: ${{ vars.CLOUDSMITH_NAMESPACE }}
      CLOUDSMITH_REPOSITORY: ${{ vars.CLOUDSMITH_REPOSITORY }}
    steps:
      - name: Validate Cloudsmith release configuration
        env:
          CLOUDSMITH_SERVICE_SLUG: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
        run: |
          set -eu
          for variable in CLOUDSMITH_NAMESPACE CLOUDSMITH_REPOSITORY CLOUDSMITH_SERVICE_SLUG; do
            test -n "$(printenv "$variable")" || {
              echo "GitHub environment cloudsmith-publish is missing $variable" >&2
              exit 1
            }
          done
          case "$GITHUB_REF_NAME" in
            *-*) component=alpha ;;
            *) component=main ;;
          esac
          echo "CLOUDSMITH_COMPONENT=$component" >> "$GITHUB_ENV"
      - name: Download attested release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rootbroker-release-${{ github.ref_name }}
          path: release
      - name: Verify Debian carrier packages
        run: |
          set -eu
          packages=(release/*.deb)
          test "${#packages[@]}" -eq 2 || {
            echo "expected two Debian packages, found ${#packages[@]}" >&2
            exit 1
          }
          for package in "${packages[@]}"; do
            test "$(dpkg-deb --field "$package" Package)" = agent-root-broker || {
              echo "unexpected Debian package identity: $package" >&2
              exit 1
            }
          done
      - name: Set up Cloudsmith CLI with GitHub OIDC
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          cli-version: "1.24.0"
          oidc-namespace: ${{ vars.CLOUDSMITH_NAMESPACE }}
          oidc-service-slug: ${{ vars.CLOUDSMITH_SERVICE_SLUG }}
          oidc-audience: https://github.com/Chang-LL
          verify-auth: "true"
      - name: Publish signed APT packages
        run: |
          set -eu
          target="${CLOUDSMITH_NAMESPACE}/${CLOUDSMITH_REPOSITORY}/any-distro/any-version"
          for package in release/*.deb; do
            cloudsmith push deb "$target" "$package" --component "$CLOUDSMITH_COMPONENT"
          done

  verify-cloudsmith-apt:
    if: github.ref_type == 'tag'
    needs: publish-cloudsmith
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:12
          - ubuntu:24.04
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    permissions:
      contents: read
    steps:
      - name: Install repository bootstrap prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg
      - name: Configure signed Cloudsmith APT repository
        env:
          RELEASE_COMPONENT: ${{ contains(github.ref_name, '-') && 'alpha' || 'main' }}
        run: |
          set -eu
          curl -1sLf \
            https://dl.cloudsmith.io/public/lc-software/agent-root-broker/setup.deb.sh \
            -o /tmp/agent-root-broker-cloudsmith-setup.sh
          env component="$RELEASE_COMPONENT" bash /tmp/agent-root-broker-cloudsmith-setup.sh
      - name: Install the tagged package from APT
        run: |
          set -eu
          expected_version="$GITHUB_REF_NAME"
          attempts=0
          until DEBIAN_FRONTEND=noninteractive apt-get install -y agent-root-broker &&
            test "$(rootbroker version | awk '{print $2}')" = "$expected_version"; do
            attempts=$((attempts + 1))
            test "$attempts" -lt 20 || exit 1
            echo "tagged package not visible yet; retrying ($attempts/20)"
            sleep 15
            apt-get update
          done
          installed_version="$(rootbroker version | awk '{print $2}')"
          test "$installed_version" = "$expected_version" || {
            echo "expected $expected_version, installed $installed_version" >&2
            exit 1
          }
          test "$(dpkg-query -W -f='${Package}' agent-root-broker)" = agent-root-broker
