name: Bug report
description: Report a reproducible rootbroker failure without sensitive host data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not post credentials, private hostnames/IPs, sensitive argv, or unredacted logs.
        Report security issues privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: rootbroker version
      placeholder: rootbroker v0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Distribution, release, architecture, and filesystem when relevant.
      placeholder: Ubuntu 24.04, amd64, ext4
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Reproduction and observed behavior
      description: Use harmless operands and redact all private data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics
      description: Include doctor/status output only after reviewing and redacting it.
